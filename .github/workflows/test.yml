name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Run deployer tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            fabric-cd/.deploy/requirements.txt
            fabric-cd/.deploy/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install -r fabric-cd/.deploy/requirements.txt
          python -m pip install -r fabric-cd/.deploy/requirements-test.txt

      - name: Run tests
        run: pytest fabric-cd/tests/deploy/test_deploy_to_dev.py -v
