name: Deploy Fabric workspace
description: >-
  Sync a Microsoft Fabric workspace to a Git commit using the Fabric Git APIs,
  authenticating to Entra ID with a GitHub OIDC token. The calling job must
  have `permissions: id-token: write`.

inputs:
  client_id:
    description: Entra app (client) ID with a federated credential for the calling repo/environment.
    required: true
  tenant_id:
    description: Entra tenant ID.
    required: true
  workspace_id:
    description: Fabric workspace ID to update. Defaults to the bound environment's FABRIC_WORKSPACE_ID variable.
    required: false
    default: ''
  connection_id:
    description: Fabric connection ID (type GitHub) used for the workspace's Git credentials.
    required: true
  commit_hash:
    description: Commit to sync the workspace to. Defaults to the triggering commit (github.sha).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -r "$ACTION_PATH/../../../fabric-cd/.deploy/requirements.txt"

    - name: Deploy to Fabric workspace
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CLIENT_ID: ${{ inputs.client_id }}
        TENANT_ID: ${{ inputs.tenant_id }}
        WORKSPACE_ID: ${{ inputs.workspace_id }}
        CONNECTION_ID: ${{ inputs.connection_id }}
        COMMIT_HASH: ${{ inputs.commit_hash || github.sha }}
        # Empty, which skips the branch check, for non-branch triggers (e.g. tags) and
        # when an explicit commit_hash is passed (it may come from another branch).
        EXPECTED_BRANCH: ${{ github.ref_type == 'branch' && inputs.commit_hash == '' && github.ref_name || '' }}
      # The OIDC token is fetched and used in this one step so it never reaches
      # GITHUB_ENV or later steps in the caller's job.
      run: |
        if [ -z "${WORKSPACE_ID:-}" ]; then
          echo "::error::No workspace ID. Pass 'workspace_id' or set the FABRIC_WORKSPACE_ID variable on the GitHub environment this job runs in."
          exit 1
        fi
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::GitHub OIDC is unavailable. The calling job needs 'permissions: id-token: write'."
          exit 1
        fi
        token="$(curl -sSf \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')"
        if [ -z "$token" ] || [ "$token" = "null" ]; then
          echo "::error::Failed to obtain a GitHub OIDC token."
          exit 1
        fi
        echo "::add-mask::$token"
        export FEDERATED_TOKEN="$token"
        unset token

        python "$ACTION_PATH/../../../fabric-cd/.deploy/deploy_to_dev.py" \
          --client_id "$CLIENT_ID" \
          --tenant_id "$TENANT_ID" \
          --workspace_id "$WORKSPACE_ID" \
          --commit_hash "$COMMIT_HASH" \
          --connection_id "$CONNECTION_ID" \
          --expected_branch "$EXPECTED_BRANCH"
